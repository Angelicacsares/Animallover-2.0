<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animallover</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ======================================================
         MENU LATERAL
    ======================================================= -->

    <nav class="menu-lateral" id="menu">

        <div class="fechar" onclick="alternarMenu()">
            ❮
        </div>

        <ul class="lista-menu">

            <li onclick="abrirInicio()">
                <span class="material-symbols-rounded icone-menu">home</span>
                <span>Início</span>
            </li>

            <li onclick="abrirAgenda()">
                <span class="material-symbols-rounded icone-menu">calendar_month</span>
                <span>Agenda</span>
            </li>

            <li onclick="abrirCadastro()">
                <span class="material-symbols-rounded icone-menu">groups</span>
                <span>Cadastro</span>
            </li>

            <li onclick="abrirVenda()">
                <span class="material-symbols-rounded icone-menu">point_of_sale</span>
                <span>Venda</span>
            </li>

            <li onclick="abrirFinanceiro()">
                <span class="material-symbols-rounded icone-menu">account_balance_wallet</span>
                <span>Financeiro</span>
            </li>

            <li onclick="abrirRelatorios()">
                <span class="material-symbols-rounded icone-menu">analytics</span>
                <span>Relatórios</span>
            </li>

            <li onclick="abrirAjustes()">
                <span class="material-symbols-rounded icone-menu">settings</span>
                <span>Ajustes</span>
            </li>

        </ul>

    </nav>

    <!-- ======================================================
         PAINEL LATERAL
    ======================================================= -->

    <div class="painel-lateral" id="painel"></div>

    <!-- ======================================================
         CABEÇALHO PRINCIPAL
    ======================================================= -->

   <header class="topo" id="topoPrincipal">

    <div class="menu" onclick="alternarMenu()">
        ☰
    </div>

    <h2 class="titulo">
        Início
    </h2>

    <div class="acoes-topo">

        <button
    class="botao-topo"
    id="botaoFiltro"
    onclick="abrirFiltrosAgenda()"
    style="display:none"
>
            <span class="material-symbols-rounded">
                filter_list
            </span>
        </button>

        <button
            class="botao-topo"
        >
            <span class="material-symbols-rounded">
                notifications
            </span>
        </button>

    </div>

</header>

    <!-- ======================================================
         CABEÇALHO DE FORMULÁRIO
         (INICIALMENTE OCULTO)
    ======================================================= -->

    <header
        class="cabecalho-formulario"
        id="topoFormulario"
        style="display:none;">
    </header>

    <!-- ======================================================
         CONTEÚDO
    ======================================================= -->

    <main id="conteudo"></main>

    <!-- ======================================================
         SCRIPTS
    ======================================================= -->

    <script src="componentes.js"></script>
    <script src="clientes.js"></script>
    <script src="pets.js"></script>
    <script src="agenda.js"></script>
    <script src="financeiro.js"></script>
    <script src="desenvolvedor.js"></script>
    <script src="banhoetosa.js"></script>
    <script src="script.js"></script>

</body>

</html>
